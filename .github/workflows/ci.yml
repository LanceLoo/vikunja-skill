name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        shell: bash
        run: |
          gofmt_files="$(gofmt -l .)"
          if [ -n "$gofmt_files" ]; then
            printf '%s\n' "The following files are not gofmt-formatted:" >&2
            printf '%s\n' "$gofmt_files" >&2
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
